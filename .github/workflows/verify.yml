name: Verify TripNow

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo SDK compatibility check
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: Expo project diagnostics
        continue-on-error: true
        run: npx --no-install expo-doctor
      - name: Verify Android bundle
        run: npm run bundle:android
